name: Release — İlgezdi Installers

# v* etiketiyle (ör. v0.6.0) push edilince 3 platformda kurulum dosyalarını
# üretir ve GitHub Releases'e yükler. Landing sayfası bu release'lerden indirir.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          # Electron 44 + electron-builder 26: paketleme sırasında çalışan
          # @electron/rebuild 4.x ve @electron/get 5.x Node >= 22.12 ister.
          # Node 20 ile yayın derlemesi kırılır. Yerel doğrulama Node 24 ile yapıldı.
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        # Yalnızca npm ci: lockfile ile birebir aynı sürümler. Eskiden "|| npm install"
        # yedeği vardı; npm ci başarısız olunca lockfile yok sayılıp farklı sürümler
        # kurulabiliyor, yayınlanan kurulum dosyasının içeriği belirsizleşiyordu.
        run: npm ci

      - name: Build (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Anahtar zincirinde sertifika ARANMAZ (Developer ID yok). Mac uygulaması yine de
          # ad-hoc imzalanır: package.json mac.identity "-" açık ayarı bunu ezmez.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ⛔ MAC: İMZASIZ UYGULAMA "HASARLI" SAYILIR (Burak, 05.10.2026 — kullanıcılar Mac'te
      #    kuramıyordu). 0.8.9 günlüğü iki mimaride de "skipped macOS application code
      #    signing" diyordu: Electron'un kendi imzası, ad/simge/asar değişince geçersiz kalıyor
      #    ve Apple Silicon bu uygulamayı "hasarlı, açılamıyor" diye reddediyor. Artık ad-hoc
      #    imzalanıyor; burada GERÇEK macOS'ta doğrulanır. İmza bozuksa ya da arm64 ikilisi
      #    imzasıyla açılmıyorsa iş DURUR — hasarlı kurulum bir daha yayına çıkamaz.
      # ⚠️ Ad-hoc imza Apple onaylı değildir: ilk açılışta macOS "Apple denetleyemedi" der,
      #    kullanıcı Sistem Ayarları › Gizlilik ve Güvenlik › "Yine de Aç" ile açar. Tam çözüm
      #    Apple Developer ID + notarization (karar Burak'ta).
      - name: Mac imzasını doğrula
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          uygulamalar=(dist/mac*/*.app)
          if [ ${#uygulamalar[@]} -eq 0 ]; then echo "Hiç .app üretilmedi"; exit 1; fi
          for app in "${uygulamalar[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          done
          # Çalıştırıcı Apple Silicon: arm64 ikilisi imzasıyla gerçekten açılıyor mu (arayüzsüz,
          # Node kipinde). İmza geçersiz olsaydı çekirdek ikiliyi öldürürdü (Killed: 9).
          # ⚠️ Electron "RunAsNode" sigortası ileride kapatılırsa bu satır güncellenmeli.
          ikili=(dist/mac-arm64/*.app/Contents/MacOS/*)
          ELECTRON_RUN_AS_NODE=1 "${ikili[0]}" -e "console.log('arm64 ikili imzasıyla açıldı, Electron', process.versions.electron)"

      # Etiketli yayınlarda ara ürün üretilmez: aynı dosyalar zaten GitHub Release'e
      # ekleniyor ve kimse ara ürünü indirmiyordu. 32 ara ürün 9,3 GB yer kaplayıp
      # ücretsiz depolama kotasını doldurdu (20 Eyl 2026). Etiketsiz denemelerde
      # dosyalar üç gün durur, sonra kendiliğinden silinir.
      - name: Kurulum dosyalarını yükle (yalnızca etiketsiz deneme)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ilgezdi-${{ matrix.platform }}
          retention-days: 3
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

      # Kurulum dosyaları imzalı değil (sertifika şimdilik alınmadı). Kullanıcının
      # indirdiği dosyanın bizim ürettiğimiz dosya olduğunu doğrulayabilmesi için
      # SHA-256 özetleri yayına ayrı bir dosya olarak eklenir.
      - name: SHA-256 özetlerini üret
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/write-checksums.js ${{ matrix.platform }}

      - name: GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        # Üçüncü taraf eylem commit kimliğine sabitlendi: etiket taşınırsa (ya da depo
        # ele geçerse) yayın işimiz contents:write yetkisiyle başkasının kodunu çalıştırırdı.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # latest*.yml ve .blockmap: uygulama içi otomatik güncelleme bunlara bakar.
          # 0.7.3'te elle yüklenmişti; artık her yayında otomatik.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
